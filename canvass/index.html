<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Window Cleaning Blitz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<main id="main">
  <section class="page" id="p-dashboard"></section>

  <section class="page" id="p-map" hidden>
    <div id="map"></div>
    <div class="mtop">
      <form id="searchForm" autocomplete="off">
        <input id="q" type="search" placeholder="Search a neighborhood (e.g. Eastmark, Mesa)" enterkeyhint="search" aria-label="Search neighborhood">
        <button class="btn pri" type="submit">Go</button>
      </form>
      <div id="results" hidden></div>
      <div class="row">
        <select id="hoodSel" aria-label="Saved neighborhoods"></select>
        <button class="btn" data-act="areas">Areas</button>
      </div>
    </div>
    <div class="mbar">
      <div class="row tools">
        <button class="btn sm" data-act="me">◎ My location</button>
        <button class="btn sm on" data-act="labels">Street labels</button>
      </div>
      <div id="chips" class="chips"></div>
      <div class="legend"><span class="ring"></span> No pin = open house (not yet approached). Tap a house to drop a pin.</div>
    </div>
  </section>

  <section class="page" id="p-customers" hidden></section>
  <section class="page" id="p-schedule" hidden></section>
  <section class="page" id="p-team" hidden></section>
</main>

<nav id="tabs" aria-label="Main">
  <button data-act="tab" data-v="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Today</span><em class="bd" hidden></em></button>
  <button data-act="tab" data-v="map"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Map</span></button>
  <button data-act="tab" data-v="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.6 3.5 2.4 3.5 5.5"/></svg><span>Customers</span></button>
  <button data-act="tab" data-v="schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Schedule</span></button>
  <button data-act="tab" data-v="team"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="11" r="2.3"/><path d="M5.5 17c.4-2 1.8-3 3.5-3s3.1 1 3.5 3M14.5 10h4M14.5 14h4"/></svg><span>Team</span></button>
</nav>

<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="js/storage.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/sheets.js"></script>
<script src="js/pages.js"></script>
<script src="js/main.js"></script>
</body>
</html>
